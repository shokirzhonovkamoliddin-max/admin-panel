<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>

    <link rel="stylesheet" href="./admin.css" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
  </head>

  <body>
    <div class="sidebar">
      <ul>
        <li><a href="#">Products</a></li>
        <li><a href="#">Users</a></li>
        <li><a href="#">Carts</a></li>
      </ul>
    </div>
    <form class="form">
      <input
        type="src"
        class="img"
        name="img"
        placeholder=" write any image link ..."
      />
      <input class="title"  required  type="text" name="title"  placeholder="title">
      <input class="price" required  type="number" name="price" placeholder="narxini yoz">
      <input class="category" required  type="text" name="category" placeholder="category">
      <input class="description" required type="text" name="description" placeholder="Description">
      <div>
        <button class="cancel">Cancel</button>
        <button class="add">Add</button>
      </div>


    </form>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Image</th>
          <th>Title</th>
          <th>Price</th>
          <th>Category</th>
          <th>Description</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody></tbody>
    </table>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <script src="./admin.js"></script>
  </body>
</html>
